# seastar io_tester config: 4 KiB random read, queue depth 128 per shard.
#
# Maps to JUring:
#   bench/juring/run-juring.sh --workload randread --file <10GiB file> \
#       --bs 4k --qd 128 --threads 1 --seconds 10 --warmup-sec 1 --readonly \
#       --label randread_4k_qd128
- name: randread_4k_qd128
  type: randread
  shards: all
  data_size: 10GB
  shard_info:
    parallelism: 128
    reqsize: 4kB
    shares: 10
    think_time: 0
