name: Bug report
description: Report a reproducible problem with JUring.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, read [docs/platforms.md](https://github.com/davidtos/JUring/blob/master/docs/platforms.md).
        Most "it does not work" reports are environment restrictions: container seccomp
        profiles, AppArmor, `kernel.io_uring_disabled`, a missing `--enable-native-access`
        flag, or a filesystem without `O_DIRECT` support.
  - type: input
    id: juring-version
    attributes:
      label: JUring version or commit
      description: The release version, or the commit SHA you built from.
      placeholder: "0.1.0 / commit SHA"
    validations:
      required: true
  - type: input
    id: jdk
    attributes:
      label: JDK
      description: Output of `java -version`.
      placeholder: "openjdk version \"25.0.1\" ..."
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`.
      placeholder: "7.0.12-200.fc44.x86_64"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and libc
      description: Distribution and version, plus glibc or musl.
      placeholder: "Fedora 44, glibc 2.42"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86-64 (amd64)
        - aarch64
        - Other (not supported)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the process run?
      options:
        - Bare metal
        - Virtual machine
        - Container (Docker / Podman)
        - Container (Kubernetes or another orchestrator)
        - Other or not sure
    validations:
      required: true
  - type: dropdown
    id: is-supported
    attributes:
      label: Result of JUring.isSupported()
      description: Call `JUring.isSupported()` before creating a ring and report what it returns.
      options:
        - "true"
        - "false"
        - Not called
    validations:
      required: true
  - type: input
    id: io-uring-disabled
    attributes:
      label: value of /proc/sys/kernel/io_uring_disabled
      description: "`cat /proc/sys/kernel/io_uring_disabled` (0 = enabled, 1 = unprivileged disabled, 2 = disabled)."
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: memlock
    attributes:
      label: Locked-memory limit
      description: Output of `ulimit -l` (and whether the process has CAP_IPC_LOCK).
      placeholder: "8192"
    validations:
      required: true
  - type: input
    id: filesystem
    attributes:
      label: Filesystem used with O_DIRECT
      description: Filesystem, mount options, and whether O_DIRECT opens and aligned reads succeed.
      placeholder: "ext4, /mnt/TestData on nvme0n1p2; O_DIRECT reads succeed"
    validations:
      required: true
  - type: dropdown
    id: native-access
    attributes:
      label: Native-access flag used at runtime
      options:
        - --enable-native-access=JUring (module path)
        - --enable-native-access=ALL-UNNAMED (classpath)
        - Not set
        - Other
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: The smallest self-contained program that shows the problem, including the JDK and JVM flags.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behaviour
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: The complete exception (with errno) or JVM output, plus a `jstack` if the process hangs. Write "none" if there is nothing beyond the description.
      render: shell
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Optional context, related issues, or a link to a reproducer repository.
    validations:
      required: false
